  html { font-size: 16px; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html.letra-grande { font-size: 18.5px; }
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
  body {
    background: rgb(var(--c-bg)); color: rgb(var(--c-ink));
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* A raiz fica PRESA na tela: só o miolo do app rola. É isso que acaba com o
     rodapé "descolando" quando a barra do navegador aparece/some no celular. */
  #root { position: fixed; inset: 0; height: 100%; height: 100dvh; }
  * { -webkit-tap-highlight-color: transparent; }
  button, a { touch-action: manipulation; }
  input, select, textarea { font: inherit; }
  input[type=number] { -moz-appearance: textfield; }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=search]::-webkit-search-cancel-button { display: none; }
  input[type=date] { min-height: 3rem; }
  .tabular-nums { font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; } }
